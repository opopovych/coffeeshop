<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IJO | Замовлення Прийнято</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-espresso: #0d0a09;
            --gold: #c5a059;
            --pure-white: #ffffff;
            --soft-gray: #f8f9fa;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--pure-white);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: var(--dark-espresso);
        }

        /* --- SUCCESS CONTAINER --- */
        .order-success-container {
            text-align: center;
            padding: 60px;
            max-width: 600px;
            border: 1px solid rgba(197, 160, 89, 0.2); /* Тонка золота рамка */
            position: relative;
            background: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.02);
        }

        .success-icon {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 30px;
            display: block;
        }

        h2 {
            font-family: 'Cinzel', serif;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 2rem;
            margin-bottom: 25px;
        }

        .order-number-box {
            background: var(--soft-gray);
            padding: 15px;
            display: inline-block;
            margin-bottom: 25px;
            border-left: 3px solid var(--gold);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        p {
            font-weight: 200;
            line-height: 1.8;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .btn-return {
            padding: 15px 40px;
            border: 1px solid var(--dark-espresso);
            background: var(--dark-espresso);
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.4s;
            text-decoration: none !important;
            display: inline-block;
        }

        .btn-return:hover {
            background: transparent;
            color: var(--dark-espresso);
            transform: translateY(-3px);
        }

        /* Декоративні кути */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid var(--gold);
        }
        .top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    </style>
</head>
<body>

    <div class="order-success-container" data-aos="zoom-in">
        <div class="corner top-left"></div>
        <div class="corner bottom-right"></div>

        <i class="fa-regular fa-circle-check success-icon"></i>
        
        <h2>Дякуємо за вибір IJO</h2>

        <div class="order-number-box">
            Номер вашого замовлення: <b th:text="${order.id}">#0001</b>
        </div>

        <p>
            Ми отримали ваш запит на справжню каву. <br>
            Наш менеджер зв'яжеться з вами найближчим часом, щоб підтвердити деталі доставки.
        </p>

        <a href="/coffee" class="btn-return">Повернутися до колекції</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>
</html>
