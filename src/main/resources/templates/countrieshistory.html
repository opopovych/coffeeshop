<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Географія Смаку | IJO Coffee</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --espresso: #1a1715;
            --cream: #fdfcf0;
            --gold: #d1b894;
            --white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--cream);
            color: var(--espresso);
            line-height: 1.7;
            overflow-x: hidden;
            /* ВИДАЛЕНО opacity: 0, щоб сторінка не була білою при завантаженні */
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(26, 23, 21, 0.98);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--gold);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--gold) !important;
            letter-spacing: 1px;
        }

        .nav-brand-link {
            color: rgba(255, 255, 255, 0.7) !important;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none !important;
            transition: 0.3s;
        }

        .nav-brand-link:hover {
            color: var(--gold) !important;
        }

        .btn-nav-catalog {
            border: 1px solid var(--gold);
            color: var(--gold) !important;
            padding: 8px 25px;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none !important;
            transition: 0.4s;
        }

        .btn-nav-catalog:hover {
            background: var(--gold);
            color: var(--espresso) !important;
        }

        /* --- HERO --- */
        .history-hero {
            height: 80vh; /* Збільшено до 80vh як в інших файлах */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('/images/country-bg.webp') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            text-align: center;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem; /* Збільшено до 4rem як в інших файлах */
            margin-bottom: 20px;
        }

        /* --- COUNTRY VISUAL BOX --- */
        .country-visual-box {
            height: 450px; /* Збільшено як висота зображень у брендах */
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--espresso);
            border: 1px solid var(--gold);
            position: relative;
            overflow: hidden;
            padding: 20px;
            transition: 0.5s;
        }

        .country-visual-box:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .country-visual-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 8px;
            text-align: center;
            line-height: 1.2;
            z-index: 2;
            pointer-events: none;
        }

        .country-visual-box::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--gold) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.15;
            z-index: 1;
        }

        /* --- CONTENT STYLE --- */
        .step-number {
            font-family: 'Playfair Display', serif;
            font-size: 5rem; /* Як у history.html */
            color: var(--gold);
            opacity: 0.3;
            line-height: 1;
        }

        .country-name {
            font-family: 'Playfair Display', serif;
            font-size: 3rem; /* Як у brandhistory.html */
            margin-bottom: 20px;
            color: var(--espresso);
        }

        .btn-discover {
            margin-top: 30px;
            display: inline-block;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 5px;
            text-decoration: none !important;
            transition: 0.4s;
        }

        .btn-discover:hover {
            color: var(--espresso);
            border-color: var(--espresso);
            padding-left: 15px;
        }

        footer {
            background: var(--espresso);
            color: var(--gold);
            padding: 60px 0;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 3px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-seedling mr-2"></i> IJO COFFEE
            </a>
            <div class="ml-auto d-flex align-items-center">
                <a th:href="@{/history}" class="nav-brand-link">Шлях IJO</a>
                <a th:href="@{/brandhistory}" class="nav-brand-link ml-4">Колекція Брендів</a>
                <a th:href="@{/countries}" class="nav-brand-link ml-4">Походження Кави</a>
                <a th:href="@{/coffee}" class="btn-nav-catalog ml-5">КАТАЛОГ</a>
            </div>
        </div>
    </nav>

    <header class="history-hero">
        <div class="container" data-aos="zoom-out">
            <h1 class="hero-title">Походження Брендів</h1>
            <p style="letter-spacing: 5px; text-transform: uppercase; font-weight: 300;">Історія країн, де народжується легендарна кава</p>
        </div>
    </header>

    <main class="py-5 mt-5">
        <div class="container">
            <div th:each="country, iterStat : ${countries}" class="row align-items-center mb-5 pb-5"
                th:classappend="${iterStat.even} ? 'flex-md-row-reverse' : ''">

                <div class="col-md-6 mb-4 mb-md-0" th:attr="data-aos=${iterStat.even ? 'fade-left' : 'fade-right'}">
                    <span class="step-number" th:text="${iterStat.count < 10 ? '0' + iterStat.count : iterStat.count}">01</span>
                    <h2 class="country-name" th:text="${country.name}">Назва країни</h2>
                    <div th:utext="${country.history}" style="font-weight: 300; color: #444;">Історія...</div>
                    <a th:href="@{/coffee/filter(countryId=${country.id})}" class="btn-discover">
                        Переглянути врожай <i class="fas fa-arrow-right ml-2"></i>
                    </a>
                </div>

                <div class="col-md-6" th:attr="data-aos=${iterStat.even ? 'fade-right' : 'fade-left'}">
                    <div class="country-visual-box">
                        <div class="country-visual-name" th:text="${country.name}">UKRAINE</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Target_Corporation_logo_vector.svg/30px-Target_Corporation_logo_vector.svg.png" class="mb-4" alt="Logo">
            <p>© 2026 IJO COFFEE | Спадщина якості</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        // Стандартна ініціалізація як у brandhistory.html
        AOS.init({ duration: 1200, once: true });
    </script>
</body>
</html>
