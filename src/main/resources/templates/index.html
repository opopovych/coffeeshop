<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <title>IJO Coffee — Справжній вибір кави від легендарних домів Європи</title>
    <meta name="description"
        content="IJO Coffee — ваш провідник у світ кавових зерен. Ідеальні купажі, насичені смаки та історія кожного зерна. Замовляйте онлайн.">
    <meta name="keywords"
        content="IJO Coffee, купити каву, кава в зернах, свіжообсмажена кава, елітна кава, кава україна">
    <link rel="canonical" href="https://ijocoffee.com.ua/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ijocoffee.com.ua/">
    <meta property="og:title" content="IJO Coffee — Мистецтво кави у кожній чашці">
    <meta property="og:description" content="Ексклюзивні кавові купажі. Відкрий для себе шлях справжнього смаку.">
    <meta property="og:image" content="https://ijocoffee.com.ua/images/favicon.png">

    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="shortcut icon" th:href="@{/images/favicon.png}">

    <link rel="apple-touch-icon" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />

    <style>
        :root {
            --dark-espresso: #0d0a09;
            --gold: #c5a059;
            --pure-white: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--pure-white);
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            color: var(--dark-espresso);
        }

        /* --- NAVBAR --- */
        .navbar {
            padding: 1.5rem 2rem;
            transition: all 0.4s ease-in-out;
            z-index: 2000;
        }

        .navbar.scrolled {
            background: rgba(13, 10, 9, 0.96);
            padding: 0.7rem 2rem;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--gold) !important;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-brand-link {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            color: var(--gold) !important;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-left: 2rem;
            transition: 0.3s;
            position: relative;
        }

        .nav-brand-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 0;
            background-color: var(--gold);
            transition: 0.3s;
        }

        .nav-brand-link:hover:after {
            width: 100%;
        }

        @media (max-width: 991px) {
            .navbar-collapse {
                background: var(--dark-espresso);
                padding: 2rem;
                margin-top: 15px;
                border-radius: 12px;
                border: 1px solid rgba(197, 160, 89, 0.2);
            }

            .nav-brand-link {
                display: block !important;
                margin: 0 !important;
                padding: 15px 0 !important;
                font-size: 1rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .navbar-brand {
                font-size: 1.2rem;
            }
        }

        /* --- HERO SECTION --- */
        .hero-section {
            height: 100vh;
            min-height: 650px;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.8)),
                url('/images/coffee.webp') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 10vw, 4.8rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: 5px;
            font-weight: 700;
        }

        .btn-premium {
            padding: 18px 50px;
            background: var(--gold);
            color: var(--dark-espresso) !important;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.4s;
            display: inline-block;
            border: 1px solid var(--gold);
        }

        .btn-premium:hover {
            background: transparent;
            color: var(--gold) !important;
            transform: translateY(-5px);
            text-decoration: none;
        }

        /* --- BRANDS SECTION --- */
        .brands-section {
            padding: 100px 0;
            background-color: #fff;
        }

        .section-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--dark-espresso);
        }

        .brand-slider .brand-item {
            padding: 20px;
            outline: none;
        }

        .brand-slider img {
            max-height: 70px;
            width: auto;
            margin: 0 auto;
            filter: grayscale(100%);
            opacity: 0.5;
            transition: 0.5s;
        }

        .brand-slider .brand-item:hover img {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.08);
        }

        /* FOOTER */
        footer {
            padding: 60px 0;
            background: #0a0a0a;
            color: #555;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark" id="mainNav">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-seedling mr-2"></i> IJO COFFEE
            </a>

            <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navContent"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <div class="ml-auto d-lg-flex align-items-center">
                    <a th:href="@{/history}" class="nav-brand-link">Шлях IJO</a>
                    <a th:href="@{/brandhistory}" class="nav-brand-link">Колекція Брендів</a>
                    <a th:href="@{/countries}" class="nav-brand-link">Походження</a>
                    <a th:href="@{/coffee}" class="btn-premium d-lg-none mt-4 text-center">Каталог Кави</a>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-content" data-aos="fade-up">
            <span
                style="letter-spacing: 8px; color: var(--gold); font-size: 0.8rem; text-transform: uppercase; display: block; margin-bottom: 1.5rem;">The
                Art of Pure Coffee</span>
            <h1>ЗРОБИ СВІЙ ВИБІР</h1>
            <p class="mb-5 px-3"
                style="font-weight: 200; font-size: 1.1rem; opacity: 0.9; max-width: 700px; margin: 0 auto 3.5rem; line-height: 1.8;">
                Ексклюзивні купажі від легендарних кавових домів Європи. <br class="d-none d-md-block"> Смак, що
                перевершує очікування.
            </p>
            <a th:href="@{/coffee}" class="btn-premium">Перейти до Каталогу</a>
        </div>
    </header>

    <section class="brands-section" th:if="${not #lists.isEmpty(brands)}">
        <div class="container">
            <div class="section-header text-center mb-5" data-aos="fade-up">
                <h2>Наші Бренди</h2>
                <div style="width: 50px; height: 1px; background: var(--gold); margin: 20px auto;"></div>
            </div>

            <div class="brand-slider" data-aos="fade-up">
                <div class="brand-item" th:each="brand : ${brands}">
                    <a th:href="@{/coffee/filter(brandId=${brand.id})}" th:aria-label="'Кава бренду ' + ${brand.name}">
                        <img th:src="@{'/images/' + ${brand.photoPath}}" th:alt="'Логотип бренду ' + ${brand.name}"
                            onerror="this.src='https://via.placeholder.com/200x80?text=Premium+Brand'" loading="lazy">
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="mb-4">
                <i class="fas fa-seedling mb-3" style="color: var(--gold); font-size: 1.5rem;"></i>
                <p style="color: #fff; font-family: 'Cinzel', serif; letter-spacing: 3px;">IJO COFFEE</p>
            </div>
            <p>© 2026 Всі права захищені</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <script>
        $(document).ready(function () {
            // Ініціалізація анімацій
            AOS.init({ duration: 1000, once: true });

            // Плавна зміна набару
            $(window).scroll(function () {
                if ($(this).scrollTop() > 50) { $('#mainNav').addClass('scrolled'); }
                else { $('#mainNav').removeClass('scrolled'); }
            });

            // Налаштування слайдера брендів
            $('.brand-slider').slick({
                slidesToShow: 5,
                slidesToScroll: 1,
                infinite: true,
                autoplay: true,
                autoplaySpeed: 2500,
                arrows: false,
                responsive: [
                    {
                        breakpoint: 1200,
                        settings: { slidesToShow: 4 }
                    },
                    {
                        breakpoint: 992,
                        settings: { slidesToShow: 3 }
                    },
                    {
                        breakpoint: 768,
                        settings: {
                            slidesToShow: 2,
                            centerMode: true,
                            centerPadding: '40px'
                        }
                    },
                    {
                        breakpoint: 480,
                        settings: {
                            slidesToShow: 1,
                            centerMode: true,
                            centerPadding: '60px'
                        }
                    }
                ]
            });
        });
    </script>
</body>

</html>
