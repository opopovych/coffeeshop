<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IJO | Private Selection</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-espresso: #0d0a09;
            --gold: #c5a059;
            --pure-white: #ffffff;
            --soft-gray: #f8f9fa;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--pure-white);
            margin: 0;
            overflow-x: hidden;
        }

        /* --- DARK HERO SECTION --- */
        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=2070') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .navbar {
            padding: 2rem 3rem;
            transition: 0.5s;
        }
        .navbar.scrolled {
            background: var(--dark-espresso);
            padding: 1rem 3rem;
        }
        .navbar-brand {
            font-family: 'Cinzel', serif;
            letter-spacing: 5px;
            color: var(--gold) !important;
            font-size: 1.8rem;
        }

        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: 5px;
        }

        .btn-premium {
            padding: 15px 40px;
            border: 1px solid var(--gold);
            background: var(--gold);
            color: var(--dark-espresso);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            transition: 0.4s;
            text-decoration: none !important;
            display: inline-block;
        }
        .btn-premium:hover {
            background: transparent;
            color: var(--gold);
            transform: translateY(-3px);
        }

        /* --- WHITE BRANDS SECTION --- */
        .brands-section {
            padding: 100px 0;
            background-color: var(--pure-white);
        }

        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }
        .section-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--dark-espresso);
            position: relative;
            display: inline-block;
            padding-bottom: 15px;
        }
        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: 0; left: 25%; width: 50%;
            height: 2px;
            background: var(--gold);
        }

        .brand-grid {
            border-top: 1px solid #eee;
            border-left: 1px solid #eee;
        }

        .brand-item {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 40px;
            transition: 0.4s;
        }

        .brand-item:hover {
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
        }

        .brand-item img {
            max-height: 70px;
            max-width: 100%;
            filter: grayscale(100%);
            opacity: 0.6;
            transition: 0.5s;
        }

        .brand-item:hover img {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.08);
        }

        

        footer {
            padding: 50px 0;
            background: #fdfdfd;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #999;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark" id="mainNav">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">IJO</a>
            <div class="ml-auto">
                <a th:href="@{/history}" class="btn btn-outline-warning btn-sm letter-spacing-2">Історія</a>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-content" data-aos="zoom-out">
            <span style="letter-spacing: 8px; color: var(--gold); font-size: 0.9rem; text-transform: uppercase; display: block; margin-bottom: 1rem;">Ми Пропонуємо</span>
            <h1>Мистецтво<br>Справжньої Кави</h1>
            <p class="mb-5" style="font-weight: 200; font-size: 1.2rem; opacity: 0.9; max-width: 600px; margin: 0 auto 3rem;">
                Відбірні зерна від найстаріших кавових домів Європи.
            </p>
            <a th:href="@{/coffee}" class="btn-premium">Перейти до каталогу</a>
        </div>
    </header>

    <section class="brands-section">
        <div class="container">
            <div class="section-header" data-aos="fade-up">
                <h2>Наші Бренди</h2>
            </div>
            
            <div class="row no-gutters brand-grid">
                <div class="col-6 col-md-3 brand-item" th:each="brand : ${brands}" data-aos="fade-up">
                    <a  class="w-100 text-center">
                        <img th:src="@{'/images/' + ${brand.photoPath}}" 
                             th:alt="${brand.name}"
                             onerror="this.src='https://via.placeholder.com/150x70?text=Brand'">
                    </a>
                </div>
                
                <div th:if="${#lists.size(brands) < 4}" class="col-6 col-md-3 brand-item">
                    <span class="text-muted small uppercase" style="letter-spacing: 2px;">Coming Soon</span>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 IJO</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
    $(function() {
        // Ініціалізація анімацій
        AOS.init({
            duration: 1000,
            once: true,
            easing: 'ease-in-out'
        });

        // Ефект зміни прозорості навбара при скролі
        $(window).scroll(function() {
            if ($(this).scrollTop() > 50) {
                $('#mainNav').addClass('scrolled');
            } else {
                $('#mainNav').removeClass('scrolled');
            }
        });
    });
</script>
</body>
</html>
