<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IJO Coffee</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>

    <style>
        :root {
            --dark-espresso: #0d0a09;
            --gold: #c5a059;
            --pure-white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--pure-white);
            margin: 0;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            padding: 1.5rem 2rem;
            transition: 0.5s;
            z-index: 2000;
        }
        .navbar.scrolled {
            background: rgba(13, 10, 9, 0.98);
            padding: 0.8rem 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--gold) !important;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .ijo { font-family: 'Playfair Display', serif; }

        /* Адаптація меню */
        @media (max-width: 991px) {
            .navbar { padding: 1rem; }
            .navbar-collapse {
                background: var(--dark-espresso);
                padding: 2rem;
                border-top: 1px solid var(--gold);
                margin-top: 10px;
            }
            .nav-brand-link {
                display: block !important;
                margin: 1.5rem 0 !important;
                text-align: center;
                font-size: 1.1rem !important;
            }
        }

        .nav-brand-link {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            color: var(--gold) !important;
            font-size: 0.9rem;
            text-transform: uppercase;
            text-decoration: none !important;
            transition: 0.4s;
        }

        /* --- HERO --- */
        .hero-section {
            height: 100vh;
            min-height: 600px;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
            url('/images/coffee.webp') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 0 1rem;
        }

        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 8vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: 4px;
        }

        .btn-premium {
            padding: 15px 40px;
            border: 1px solid var(--gold);
            background: var(--gold);
            color: var(--dark-espresso);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: 0.4s;
            text-decoration: none !important;
            display: inline-block;
        }
        .btn-premium:hover { background: transparent; color: var(--gold); transform: translateY(-3px); }

        /* --- BRANDS SECTION --- */
        .brands-section {
            padding: 80px 0;
            background-color: var(--pure-white);
            overflow: hidden;
        }

        .section-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--dark-espresso);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .brand-carousel-wrapper {
            position: relative;
            padding: 0 50px;
            max-width: 1200px;
            margin: 40px auto 0;
        }

        .brand-item {
            outline: none;
            height: 120px;
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        .brand-item img {
            mix-blend-mode: multiply;
            max-height: 60px;
            width: auto;
            max-width: 80%;
            object-fit: contain;
            filter: grayscale(100%);
            opacity: 0.5;
            transition: 0.5s ease;
        }

        @media (max-width: 768px) {
            .brand-carousel-wrapper { padding: 0; }
            .brand-item img { max-height: 45px; opacity: 0.8; }
            .slick-arrow { display: none !important; }
        }

        /* Custom Arrows */
        .slick-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
        }
        .slick-prev { left: 10px; }
        .slick-next { right: 10px; }

        footer {
            padding: 40px 0;
            background: #fafafa;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #bbb;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top navbar-dark" id="mainNav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="fas fa-seedling mr-2"></i> IJO COFFEE
        </a>

        <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navContent">
            <div class="ml-auto d-lg-flex align-items-center">
                <a th:href="@{/history}" class="nav-brand-link">Шлях <span class="ijo">IJO</span></a>
                <a th:href="@{/brandhistory}" class="nav-brand-link ml-lg-4">Колекція Брендів</a>
                <a th:href="@{/countries}" class="nav-brand-link ml-lg-4">Походження Кави</a>
                <a th:href="@{/coffee}" class="btn btn-outline-warning btn-sm ml-lg-4 d-lg-none mt-2">Каталог</a>
            </div>
        </div>
    </div>
</nav>

<header class="hero-section">
    <div class="hero-content" data-aos="fade-up">
        <span style="letter-spacing: 6px; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; display: block; margin-bottom: 1rem;">The Art of Coffee</span>
        <h1>Зроби свій вибір</h1>
        <p class="mb-5" style="font-weight: 200; font-size: 1rem; opacity: 0.8; max-width: 600px; margin: 0 auto 3rem; letter-spacing: 1px;">
            Ексклюзивні купажі від легендарних кавових домів Європи.
        </p>
        <a th:href="@{/coffee}" class="btn-premium shadow-lg">Каталог</a>
    </div>
</header>

<section class="brands-section" th:if="${not #lists.isEmpty(brands)}">
    <div class="container">
        <div class="section-header text-center" data-aos="fade-up">
            <h2>Наші Бренди</h2>
            <div style="width: 40px; height: 1px; background: var(--gold); margin: 15px auto;"></div>
        </div>

        <div class="brand-carousel-wrapper" data-aos="fade-up">
            <button class="slick-prev d-none d-md-block"><i class="fas fa-chevron-left"></i></button>
            <button class="slick-next d-none d-md-block"><i class="fas fa-chevron-right"></i></button>

            <div class="brand-slider">
                <div class="brand-item" th:each="brand : ${brands}">
                    <a th:href="@{/coffee/filter(brandId=${brand.id})}" class="brand-link">
                        <img th:src="@{'/images/' + ${brand.photoPath}}" th:alt="${brand.name}" onerror="this.src='https://via.placeholder.com/150x70?text=Brand'">
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p>© 2026 IJO COFFEE</p>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

<script>
    $(document).ready(function() {
        AOS.init({ duration: 1000, once: true });

        // Ефект прокрутки
        $(window).scroll(function() {
            if ($(this).scrollTop() > 50) { $('#mainNav').addClass('scrolled'); }
            else { $('#mainNav').removeClass('scrolled'); }
        });

        // Налаштування слайдера
        var $slider = $('.brand-slider');
        $slider.slick({
            slidesToShow: 4,
            slidesToScroll: 1,
            infinite: true,
            autoplay: true,
            autoplaySpeed: 3000,
            prevArrow: $('.slick-prev'),
            nextArrow: $('.slick-next'),
            responsive: [
                {
                    breakpoint: 1024,
                    settings: { slidesToShow: 3 }
                },
                {
                    breakpoint: 768,
                    settings: { 
                        slidesToShow: 1,
                        centerMode: true,
                        centerPadding: '60px',
                        arrows: false
                    }
                }
            ]
        });

        // Виправлення відображення після завантаження
        $(window).on('load', function() {
            $slider.slick('setPosition');
        });
    });
</script>
</body>
</html>
