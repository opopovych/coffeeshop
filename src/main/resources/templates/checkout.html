<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IJO Coffee | Оформлення замовлення</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="shortcut icon" th:href="@{/images/favicon.png}">

    <link rel="apple-touch-icon" th:href="@{/images/favicon.png}">
    <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap"
            rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        :root {
            --espresso: #2e2a28;
            --cream: #fdfcf0;
            --gold: #d1b894;
            --dark-gold: #b08d5b;
            --white: #ffffff;
            --light-bg: #fafafa;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--cream);
            color: var(--espresso);
            margin: 0;
            padding-bottom: 80px;
        }

        /* Navbar */
        .navbar {
            background: var(--espresso) !important;
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--gold);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            color: var(--gold) !important;
            letter-spacing: 2px;
        }

        /* Блоки оформлення */
        .checkout-block {
            background: var(--white);
            border: 1px solid #eee;
            padding: 35px;
            margin-bottom: 25px;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .checkout-block:hover {
            border-color: var(--gold);
        }

        .block-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #f5f5f5;
            padding-bottom: 15px;
        }

        .step-number {
            background: var(--espresso);
            color: var(--gold);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 15px;
            font-size: 0.85rem;
        }

        .block-header h4 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.4rem;
        }

        /* Поля вводу */
        .form-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--dark-gold);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .form-control,
        .select2-container--default .select2-selection--single {
            border-radius: 0 !important;
            border: 1px solid #eee !important;
            height: 52px !important;
            background: var(--light-bg) !important;
            padding-left: 15px;
        }

        textarea.form-control {
            height: auto !important;
            padding-top: 15px;
        }

        /* Кнопки перемикання доставки */
        .delivery-type-btn {
            flex: 1;
            border: 1px solid #eee;
            background: var(--light-bg);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .delivery-type-btn.active {
            background: var(--espresso);
            color: var(--gold);
            border-color: var(--espresso);
        }

        /* Sidebar підсумок */
        .summary-box {
            background: var(--espresso);
            color: var(--gold);
            padding: 40px;
            position: sticky;
            top: 40px;
            border-top: 5px solid var(--gold);
        }

        .total-price {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin: 20px 0;
        }

        .btn-confirm {
            background: var(--gold);
            color: var(--espresso);
            border: none;
            padding: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
            transition: 0.4s;
            margin-top: 20px;
        }

        .btn-confirm:hover:not(:disabled) {
            background: var(--white);
            color: var(--espresso);
            transform: translateY(-3px);
        }

        .navbar-brand {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #e63946;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--espresso);
        }

        @media (max-width: 991px) {
            .summary-box {
                position: static;
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <div style="width: 150px;">
            <a th:href="@{/cart/view}" class="text-white small text-uppercase p-2">
                <i class="fas fa-chevron-left mr-1"></i>
                <span class="d-none d-md-inline">До кошика</span>
            </a>
        </div>

        <a class="navbar-brand m-0" th:href="@{/}">
            <i class="fas fa-seedling mr-2"></i> IJO COFFEE
        </a>

        <div style="width: 150px;" class="text-right">
            <a th:href="@{/cart/view}" style="position: relative; display: inline-block;">
                <i class="fas fa-shopping-basket text-white" style="font-size: 1.2rem;"></i>
                <span id="cart-count-badge" class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-lg-8">
            <form th:action="@{/order/checkout}" method="post" id="checkoutForm">

                <div class="checkout-block">
                    <div class="block-header">
                        <span class="step-number">1</span>
                        <h4>Контактні дані</h4>
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="form-label">Ім'я</label>
                            <input type="text" name="name" class="form-control" placeholder="Введіть ім'я" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="form-label">Прізвище</label>
                            <input type="text" name="surName" class="form-control" placeholder="Введіть прізвище" required>
                        </div>
                        <div class="col-md-12 form-group">
                            <label class="form-label">Телефон</label>
                            <input type="tel" id="phoneInput" name="phone" class="form-control" placeholder="+38 (0__) ___ __ __" required>
                        </div>
                    </div>
                </div>

                <div class="checkout-block">
                    <div class="block-header">
                        <span class="step-number">2</span>
                        <h4>Доставка</h4>
                    </div>

                    <div class="d-flex mb-4" style="gap: 10px;">
                        <div class="delivery-type-btn active" id="btn-np" onclick="toggleDelivery('NP')">Нова Пошта</div>
                        <div class="delivery-type-btn" id="btn-up" onclick="toggleDelivery('UP')">Укрпошта</div>
                        <input type="hidden" name="deliveryProvider" id="deliveryProvider" value="NP">
                    </div>

                    <input type="hidden" name="cityName" id="cityNameHidden">

                    <div class="form-group">
                        <label class="form-label">Ваше місто</label>
                        <div id="cityContainer">
                            <select id="citySelect" class="form-control" required style="width: 100%;">
                                <option value="">Почніть вводити назву міста...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Відділення</label>
                        <div id="warehouseContainer">
                            <select id="warehouseSelect" name="wareHouse" class="form-control" disabled required style="width: 100%;">
                                <option value="">Спочатку оберіть місто</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="checkout-block">
                    <div class="block-header">
                        <span class="step-number">3</span>
                        <h4>Оплата та коментар</h4>
                    </div>

                    <div class="payment-options">
                        <div class="payment-option custom-control custom-radio mb-3 p-3 border">
                            <input type="radio" id="payCash" name="paymentMethod" value="При отриманні" class="custom-control-input" checked required>
                            <label class="custom-control-label w-100" for="payCash" style="cursor:pointer;">
                                <strong>Накладений платіж</strong>
                                <small class="d-block text-muted">Оплата у відділенні пошти</small>
                            </label>
                        </div>

                        <div class="payment-option custom-control custom-radio p-3 border">
                            <input type="radio" id="payCard" name="paymentMethod" value="На карту (IBAN)" class="custom-control-input" required>
                            <label class="custom-control-label w-100" for="payCard" style="cursor:pointer;">
                                <strong>Оплата на рахунок IBAN</strong>
                                <small class="d-block text-muted">Реквізити надішлемо в месенджер</small>
                            </label>
                        </div>
                    </div>

                    <div class="form-group mt-4">
                        <label class="form-label">Коментар до замовлення</label>
                        <textarea name="comment" class="form-control" rows="3" placeholder="Додаткова інформація..."></textarea>
                    </div>
                </div>
            </form>
        </div>

        <div class="col-lg-4">
            <div class="summary-box">
                <h6 class="text-uppercase mb-3" style="letter-spacing: 2px; opacity: 0.8;">До сплати</h6>
                <div class="total-price">
                    <span th:text="${total}">0</span> <small style="font-size: 1.2rem;">грн</small>
                </div>

                <hr style="border-top: 1px solid rgba(209, 184, 148, 0.2);">

                <ul class="list-unstyled small mb-4" style="opacity: 0.8; line-height: 2;">
                    <li><i class="fas fa-truck mr-2"></i> Відправка протягом 24 годин</li>
                </ul>

                <button type="submit" form="checkoutForm" id="submitBtn" class="btn btn-confirm">
                    Підтвердити замовлення
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.maskedinput/1.4.1/jquery.maskedinput.min.js"></script>

<script>
    function toggleDelivery(type) {
        $('.delivery-type-btn').removeClass('active');
        $('#deliveryProvider').val(type);

        const cityCont = $('#cityContainer');
        const warehouseCont = $('#warehouseContainer');

        if (type === 'UP') {
            $('#btn-up').addClass('active');
            cityCont.html('<input type="text" id="cityManual" class="form-control" placeholder="Введіть область та місто" required>');
            warehouseCont.html('<input type="text" name="wareHouse" class="form-control" placeholder="Номер відділення або індекс" required>');

            $('#cityManual').on('input', function() {
                $('#cityNameHidden').val($(this).val());
            });
        } else {
            $('#btn-np').addClass('active');
            // Перезавантажуємо для ініціалізації Select2
            location.reload();
        }
    }

    $(document).ready(function () {
        $("#phoneInput").mask("+38 (099) 999 99 99");

        // Ініціалізація Нової Пошти
        $('#citySelect').select2({
            ajax: {
                url: '/api/shipping/cities',
                dataType: 'json',
                delay: 250,
                data: params => ({ name: params.term }),
                processResults: data => ({
                    results: $.map(data, item => ({ text: item.Description, id: item.Ref }))
                })
            }
        });

        $('#citySelect').on('select2:select', function (e) {
            const data = e.params.data;
            $('#cityNameHidden').val(data.text);
            const whSelect = $('#warehouseSelect');
            whSelect.prop('disabled', true).html('<option>Завантаження...</option>');

            $.get('/api/shipping/warehouses', { cityRef: data.id }, function (res) {
                let opts = '<option value="">Оберіть відділення...</option>';
                res.forEach(w => { opts += `<option value="${w.Description}">${w.Description}</option>`; });
                whSelect.html(opts).prop('disabled', false);
            });
        });

        $('#checkoutForm').on('submit', function () {
            $('#submitBtn').prop('disabled', true).html('<i class="fas fa-circle-notch fa-spin mr-2"></i> Оформлюємо...');
            return true;
        });
    });
</script>
</body>
</html>
