<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IJO Coffee | Оформлення</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        :root {
            --espresso: #2e2a28;
            --cream: #fdfcf0;
            --gold: #d1b894;
            --dark-gold: #b08d5b;
            --white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--cream);
            color: var(--espresso);
            margin: 0;
            padding-bottom: 80px;
        }

        .navbar {
            background: var(--espresso) !important;
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--gold);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            color: var(--gold) !important;
            letter-spacing: 2px;
        }

        .card-custom {
            background: var(--white);
            border: none;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.03);
            border-radius: 0;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            margin-bottom: 30px;
            padding-bottom: 15px;
            position: relative;
        }
        h2::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 50px; height: 2px;
            background: var(--gold);
        }

        .form-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--dark-gold);
            text-transform: uppercase;
            margin-top: 15px;
        }

        /* Стилізація полів та Select2 під дизайн IJO */
        .form-control, .select2-container--default .select2-selection--single {
            border-radius: 0 !important;
            border: 1px solid #eee !important;
            height: 52px !important;
            background: #fafafa !important;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 50px !important;
            padding-left: 15px !important;
            color: var(--espresso) !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 50px !important;
        }

        .summary-box {
            background: var(--espresso);
            color: var(--gold);
            padding: 40px;
            position: sticky;
            top: 100px;
            border-top: 5px solid var(--gold);
        }

        .total-price {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin: 20px 0;
        }

        .btn-confirm {
            background: var(--gold);
            color: var(--espresso);
            border: none;
            padding: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
            transition: 0.4s;
            cursor: pointer;
        }

        .btn-confirm:hover:not(:disabled) {
            background: var(--white);
            color: var(--espresso);
            transform: translateY(-3px);
        }

        .ijo-badge {
            font-size: 0.6rem;
            letter-spacing: 3px;
            border: 1px solid var(--gold);
            padding: 5px 10px;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        #warehouseSelect:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/coffee}">IJO COFFEE</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">

        <div class="col-lg-7">
            <div class="card-custom">
                <a th:href="@{/cart/view}" class="text-muted small mb-4 d-inline-block text-decoration-none">
                    <i class="fas fa-chevron-left mr-1"></i> ПОВЕРНУТИСЬ ДО КОШИКА
                </a>

                <div class="mt-2">
                    <div class="ijo-badge">IJO - ПРАВИЛЬНИЙ ВИБІР</div>
                    <h2>Деталі доставки</h2>
                </div>

                <form th:action="@{/order/checkout}" method="post" id="checkoutForm">
                    <div class="form-group">
                        <label class="form-label">Ваше ім'я</label>
                        <input type="text" name="name" class="form-control" placeholder="Олександр Іванов" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Контактний телефон</label>
                        <input type="tel" id="phoneInput" name="phone" class="form-control" placeholder="+38 (0__) ___ __ __" required>
                    </div>

                    <hr class="my-4">

                    <input type="hidden" name="cityName" id="cityNameHidden">

                    <div class="form-group">
                        <label class="form-label">Місто (Нова Пошта)</label>
                        <select id="citySelect" class="form-control" required>
                            <option value="">Почніть вводити назву міста...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Оберіть відділення</label>
                        <select id="warehouseSelect" name="wareHouse" class="form-control" disabled required>
                            <option value="">Спочатку оберіть місто</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-5 mt-4 mt-lg-0">
            <div class="summary-box">
                <h6 class="text-uppercase mb-2" style="letter-spacing: 3px; opacity: 0.8;">Підсумок замовлення</h6>
                <div class="total-price">
                    <span th:text="${total}">0</span> <small style="font-size: 1rem;">ГРН</small>
                </div>

                <p class="small mb-5" style="opacity: 0.7;">
                    Доставка здійснюється Новою Поштою. Оплата послуг доставки згідно з тарифами перевізника при отриманні.
                </p>

                <button type="submit" form="checkoutForm" id="submitBtn" class="btn btn-confirm">
                    Підтвердити замовлення
                </button>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/i18n/uk.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.maskedinput/1.4.1/jquery.maskedinput.min.js"></script>
<script>
    $(document).ready(function() {
        // 1. Маска телефону
        $("#phoneInput").mask("+38 (099) 999 99 99");

        // 2. Ініціалізація Select2 для міст
        $('#citySelect').select2({
            language: "uk",
            minimumInputLength: 2,
            ajax: {
                url: '/api/shipping/cities',
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return { name: params.term };
                },
                processResults: function (data) {
                    return {
                        results: $.map(data, function (item) {
                            return {
                                text: item.Description,
                                id: item.Ref // Відправляємо Ref (код) для отримання відділень
                            }
                        })
                    };
                }
            }
        });

        // 3. Обробка вибору міста
        $('#citySelect').on('select2:select', function (e) {
            const data = e.params.data;
            const cityRef = data.id;      // Код для API
            const cityName = data.text;   // Назва для людини

            // Записуємо назву міста в приховане поле
            $('#cityNameHidden').val(cityName);

            // Отримуємо відділення
            const warehouseSelect = $('#warehouseSelect');
            warehouseSelect.prop('disabled', true).html('<option>Завантаження відділень...</option>');

            $.get('/api/shipping/warehouses', { cityRef: cityRef }, function(data) {
                let options = '<option value="">Оберіть номер відділення...</option>';
                data.forEach(function(w) {
                    options += `<option value="${w.Description}">${w.Description}</option>`;
                });
                warehouseSelect.html(options).prop('disabled', false);
            });
        });

        // 4. Запобігання подвійній відправці
        $('#checkoutForm').on('submit', function() {
            const btn = $('#submitBtn');
            btn.prop('disabled', true);
            btn.html('<i class="fas fa-circle-notch fa-spin mr-2"></i> ОФОРМЛЕННЯ...');
            return true;
        });
    });
</script>
</body>
</html>
