<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${coffee.brand.name} + ' ' + ${coffee.name}">Coffee Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #fafafa;
            color: #333;
        }

        header {
            background: #2e2a28;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .coffee-image {
            flex: 1 1 400px;
            max-width: 400px;
        }

        .coffee-image img {
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .coffee-info {
            flex: 1 1 400px;
        }

        .coffee-info h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #3e2723;
        }

        .attribute {
            font-size: 16px;
            margin: 8px 0;
        }

        .attribute .label {
            font-weight: bold;
            color: #5d4037;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #3e2723;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #3e2723;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn:hover {
            background: #5d4037;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .coffee-info, .coffee-image {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    Coffee Shop — Деталі кави
</header>

<div class="container">

    <!-- Фото кави -->
    <div class="coffee-image">
        <img th:src="@{'/images/' + ${coffee.photoPath}}" alt="Coffee Photo"/>
    </div>

    <!-- Інформація про каву -->
    <div class="coffee-info">
        <h1 th:text="${coffee.brand.name} + ' ' + ${coffee.name}">Coffee Name</h1>

        <div class="attribute">
            <span class="label">Інтенсивність:</span> <span th:text="${coffee.intensity.displayName}"></span>
        </div>

        <div class="attribute">
            <span class="label">Обжарка:</span> <span th:text="${coffee.roastLevel.displayName}"></span>
        </div>

        <div class="attribute">
            <span class="label">Гіркота:</span> <span th:text="${coffee.bitterness.displayName}"></span>
        </div>

        <div class="attribute">
            <span class="label">Склад:</span> <span th:text="${coffee.composition.displayName}"></span>
        </div>

        <div class="attribute">
            <span class="label">Ціна:</span> ₴<span th:text="${coffee.price}"></span>
        </div>
        <div class="attribute">
            <span class="label">Опис:</span> <span th:text="${coffee.description}"></span>
        </div>
        <div class="attribute">
            <span class="label">Кислота:</span> <span th:text="${coffee.acidity.displayName}"></span>
        </div>
        <div class="attribute">
            <span class="label">Країна:</span> <span th:text="${coffee.originCountry.name}"></span>
        </div>
        <form th:action="@{'/cart/add/' + ${coffee.id}}" method="post">
            <input type="number" name="quantity" value="1" min="1">
            <button type="submit">Додати в кошик</button>
        </form>

        <a class="btn" href="/coffee" >Назад</a>
    </div>

</div>

</body>
</html>
