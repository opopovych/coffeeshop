<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title th:text="${seoTitle}">IJO Coffee — Каталог кавових домів</title>
    <meta name="description" th:content="${seoDescription}">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --gold: #c5a059;
            --brand-dark: #2e2a28;
            --light-bg: #ffffff;
            --soft-gray: #f8f9fa;
        }

        body {
            background-color: var(--light-bg);
            color: var(--brand-dark); /* Темний текст для читабельності */
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            color: var(--brand-dark);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }

        /* Золота лінія під заголовком */
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background-color: var(--gold);
        }

        /* КОНТЕЙНЕР БРЕНДІВ */
        .brands-outer-wrapper {
            position: relative;
            padding: 30px 0;
            background-color: var(--soft-gray); /* Легке виділення зони брендів */
            border-radius: 15px;
        }

        .brands-scroll-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 20px;
            padding: 20px;
            scrollbar-width: none;
            cursor: grab;
        }

        .brands-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .brand-card {
            flex: 0 0 calc(100% / 6 - 20px);
            min-width: 150px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none !important;
        }

        /* Прямокутник логотипу на світлому фоні */
        .brand-logo-rect {
            width: 100%;
            height: 110px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 0, 0, 0.05); /* Дуже легка межа */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); /* М'яка тінь */
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .brand-logo-rect img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: grayscale(100%);
            opacity: 0.7;
            transition: all 0.4s ease;
        }

        /* Ефекти при наведенні */
        .brand-card:hover {
            transform: translateY(-5px);
        }

        .brand-card:hover .brand-logo-rect {
            border-color: var(--gold);
            box-shadow: 0 8px 25px rgba(197, 160, 89, 0.15);
        }

        .brand-card:hover img {
            filter: grayscale(0%);
            opacity: 1;
        }

        .brand-name {
            color: var(--brand-dark);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 5px;
            transition: color 0.3s ease;
        }

        .brand-card:hover .brand-name {
            color: var(--gold);
        }

        /* Адаптація під мобільні */
        @media (max-width: 992px) {
            .brand-card {
                flex: 0 0 calc(100% / 3.5);
            }
        }

        @media (max-width: 768px) {
            .brand-card {
                flex: 0 0 130px; /* Трохи менші на мобілці */
                min-width: 130px;
            }
            .brand-logo-rect {
                height: 85px;
                padding: 12px;
            }
            .section-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <main class="container py-5">
        
        <section class="mb-5" data-aos="fade-down">
            <h2 class="section-title text-center mb-5">Ексклюзивні Кавові Доми</h2>
            
            <div class="brands-outer-wrapper">
                <div class="brands-scroll-container" id="brandsScroll">
                    
                    <div th:each="brand : ${brands}" class="brand-card">
                        <a th:href="@{/coffee(brandId=${brand.id})}">
                            <div class="brand-logo-rect">
                                <img th:src="@{'/images/' + ${brand.photoPath}}"
                                     th:alt="${brand.name}">
                            </div>
                            <p class="brand-name" th:text="${brand.name}">BRAND NAME</p>
                        </a>
                    </div>
                    
                </div>
            </div>
        </section>

    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        const slider = document.querySelector('#brandsScroll');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.style.cursor = 'grabbing';
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.cursor = 'grab';
        });
        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.cursor = 'grab';
        });
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; 
            slider.scrollLeft = scrollLeft - walk;
        });
    </script>
</body>
</html>
