<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IJO Coffee | Кошик</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        :root {
            --espresso: #2e2a28;
            --cream: #fdfcf0;
            --gold: #d1b894;
            --dark-gold: #b08d5b;
            --white: #ffffff;
            --accent-red: #e63946;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--cream);
            color: var(--espresso);
            margin: 0;
            padding-bottom: 120px;
        }

        /* --- НАВБАР --- */
        .navbar {
            background: var(--espresso) !important;
            padding: 0.8rem 2rem;
            border-bottom: 2px solid var(--gold);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            color: var(--gold) !important;
            font-size: 1.5rem;
        }

        .container {
            max-width: 900px;
            margin-top: 50px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* --- КАРТКА ТОВАРУ У КОШИКУ --- */
        .cart-card {
            display: grid;
            grid-template-columns: 100px 1fr auto auto auto;
            align-items: center;
            gap: 20px;
            background: var(--white);
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            transition: 0.3s;
        }

        .cart-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .cart-card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: #fcfcfc;
        }

        .coffee-details .coffee-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .coffee-details .brand-info {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--dark-gold);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .coffee-details .characteristics {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
        }

        /* --- ЦІНА ТА КІЛЬКІСТЬ --- */
        .price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--espresso);
            min-width: 100px;
            text-align: center;
        }

        .qty-input {
            width: 60px;
            height: 40px;
            border: 1px solid var(--gold);
            text-align: center;
            font-weight: 600;
            border-radius: 0;
        }

        /* --- КНОПКА ВИДАЛЕННЯ --- */
        .remove-btn {
            background: transparent;
            color: #ccc;
            border: none;
            font-size: 1.2rem;
            padding: 5px 10px;
            transition: 0.3s;
            cursor: pointer;
        }

        .remove-btn:hover {
            color: var(--accent-red);
        }

        /* --- ПІДСУМОК --- */
        .summary-block {
            background: var(--espresso);
            color: var(--gold);
            padding: 30px;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: 700;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-checkout {
            background: var(--espresso);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 15px 40px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none !important;
            transition: 0.3s;
        }

        .btn-checkout:hover {
            background: var(--gold);
            color: var(--espresso);
        }

        .btn-continue {
            color: var(--espresso);
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none !important;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 5px;
        }

        .empty-cart {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-cart i {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 20px;
            display: block;
        }

        footer {
            background: var(--espresso);
            color: var(--gold);
            border-top: 2px solid var(--gold);
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px 0;
            z-index: 1000;
        }

        /* Контейнер назви та ваги */
        .coffee-name-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .coffee-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--espresso);
        }

        .weight-badge {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--dark-gold);
            border: 1px solid var(--gold);
            padding: 1px 5px;
        }

        .characteristics {
            font-size: 0.8rem;
            color: var(--espresso);
            opacity: 0.85;
        }

        /* Кожна характеристика з однаковим відступом */
        .char-item {
            margin-bottom: 3px;
            display: block;
            /* Можна змінити на inline-block, якщо хочете в рядок */
        }

        /* Стиль для іконок, щоб вони були золотистими як у каталозі */
        .char-item i {
            color: var(--gold);
            width: 16px;
            text-align: center;
        }

        .brand-info {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--dark-gold);
        }

        /* Робимо стрілочки завжди видимими для Chrome, Safari, Edge, Opera */
.qty-input::-webkit-outer-spin-button,
.qty-input::-webkit-inner-spin-button {
    opacity: 1 !important;
    -webkit-appearance: inner-spin-button !important;
}

/* Для Firefox (у Firefox стрілочки зазвичай з'являються при типі 'number', 
   але ми додаємо це для стабільності) */
.qty-input {
    -moz-appearance: number-input !important;
    appearance: auto !important;
}

/* Додаткові стилі, щоб поле виглядало акуратно та вишукано */
.qty-input {
    width: 70px; /* Оптимальна ширина */
    height: 40px;
    padding: 5px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 0; /* Рівні краї додають преміальності */
    background: transparent;
    font-weight: 500;
    font-family: 'Montserrat', sans-serif;
}

/* Прибираємо синій контур при натисканні (фокусі) */
.qty-input:focus {
    outline: none;
    border-color: #c5a059; /* Ваш золотий колір для акценту */
}
        
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/coffee}">
                <i class="fas fa-seedling mr-2"></i> IJO COFFEE
            </a>
            <div class="ml-auto">
                <span class="text-white small text-uppercase" style="letter-spacing: 1px;">Ваш кошик</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Кошик</h1>

        <div th:if="${cart.items.size() == 0}" class="empty-cart">
            <i class="fas fa-mug-hot"></i>
            <h2>Ваш кошик порожній</h2>
            <p class="text-muted mb-4">Здається, ви ще не обрали свою ідеальну каву.</p>
            <a th:href="@{/coffee}" class="btn-checkout">До каталогу</a>
        </div>

        <div th:if="${cart.items.size() > 0}">
            <div th:each="item : ${cart.items}" class="cart-card">

                <img th:src="@{'/images/' + ${item.photoPath}}" alt="Coffee">

                <div class="coffee-details">
                    <div class="brand-info" th:text="${item.brand}">BRAND</div>

                    <div class="coffee-name-container">
                        <span class="coffee-name" th:text="${item.name}">Назва кави</span>
                        <span class="weight-badge" th:text="${item.weight}">250г</span>
                    </div>

                    <div class="characteristics">
                        <div class="char-item">
                            <i class="fas fa-leaf mr-1"></i>
                            Склад: <span th:text="${item.composition}">Арабіка</span>
                        </div>
                        <div class="char-item">
                            <i class="fas fa-fire mr-1"></i>
                            Обжарка: <span th:text="${item.roastLevel}">Середня</span>
                        </div>
                        <div class="char-item">
                            <i class="fas fa-bolt mr-1"></i>
                            Міцність: <span th:text="${item.intensity}">3</span>
                        </div>
                        <div class="char-item">
                            <i class="fas fa-tint-slash mr-1"></i>
                            Гіркота: <span th:text="${item.bitterness}">2</span>
                        </div>
                    </div>
                </div>

                <div class="price">
                    ₴ <span th:text="${item.price}">0</span>
                </div>

                <form th:action="@{'/cart/update/' + ${item.coffeeId}}" method="post">
                    <input type="number" name="quantity" th:value="${item.quantity}" onchange="this.form.submit()"
                        class="qty-input" min="1">
                </form>

                <form th:action="@{'/cart/remove/' + ${item.coffeeId}}" method="post">
                    <button type="submit" class="remove-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </form>
            </div>

            <div class="summary-block">
                <div class="total-label">Загальна сума:</div>
                <div class="total-amount">₴ <span th:text="${total}">0</span></div>
            </div>

            <div class="actions">
                <a th:href="@{/coffee}" class="btn-continue">
                    <i class="fas fa-arrow-left mr-2"></i> Продовжити покупки
                </a>
                <a th:href="@{/order/checkout}" class="btn-checkout">
                    Оформити замовлення <i class="fas fa-chevron-right ml-2"></i>
                </a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container-fluid text-center">
            <small>© 2026 IJO Coffee — Тільки преміальні сорти</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>

</html>
