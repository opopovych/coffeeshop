<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Відсутні у постачальника | IJO</title>
    <style>
        body { background: #f8f9fa; font-family: 'Arial', sans-serif; }
        .card-missing { border-radius: 15px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .sku-badge { background: #fce4ec; color: #c2185b; font-family: monospace; padding: 4px 8px; border-radius: 5px; }
        .status-tag { font-size: 0.8rem; padding: 3px 10px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="text-danger"><i class="fas fa-exclamation-triangle mr-2"></i> Товари, відсутні в прайсі</h3>
            <p class="text-muted">Ці товари є у вашій базі, але постачальник їх не надав у файлі.</p>
        </div>
        <a th:href="@{/admin/sync}" class="btn btn-outline-secondary"> Назад до синхронізації</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div class="card card-missing" th:if="${products != null && !products.isEmpty()}">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="thead-light">
                <tr>
                    <th class="pl-4">SKU</th>
                    <th>Товар</th>
                    <th>Поточна ціна</th>
                    <th>Статус</th>
                    <th class="text-right pr-4">Дія</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td class="pl-4 pt-3">
                        <span class="sku-badge" th:text="${p.sku}"></span>
                    </td>
                    <td class="pt-3">
                        <strong th:text="${p.brand.name}"></strong> <span th:text="${p.name}"></span>
                    </td>
                    <td class="pt-3" th:text="${p.price + ' ₴'}"></td>
                    <td class="pt-3">
                        <span th:if="${p.active}" class="badge badge-success status-tag">Активний</span>
                        <span th:unless="${p.active}" class="badge badge-secondary status-tag">Пасивний</span>
                    </td>
                    <td class="text-right pr-4">
                        <a th:href="@{/admin/coffee/edit/{id}(id=${p.id})}" class="btn btn-sm btn-light">
                            <i class="fas fa-edit"></i> Перевірити
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
