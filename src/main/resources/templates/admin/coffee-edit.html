<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати Кавовий Продукт</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-container { max-width: 800px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 120px; }
        .enum-group label { display: inline-block; margin-right: 15px; font-weight: normal; }
        button { padding: 10px 15px; background-color: #FFC107; color: black; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #e0a800; }
        .current-photo img { max-width: 150px; border: 1px solid #ccc; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>✏️ Редагувати Кавовий Продукт</h2>

    <form th:action="@{/admin/coffee/edit/{id}(id=*{id})}" th:object="${coffeeBean}" method="post" enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="name">Назва Кави:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="description">Опис:</label>
            <textarea id="description" th:field="*{description}"></textarea>
        </div>

        <div class="form-group">
            <label for="price">Ціна (UAH):</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" required>
        </div>
        <div class="form-group">
            <label for="sku">Код :</label>
            <input type="number"  id="sku" th:field="*{sku}" >
        </div>

        <hr>

        <div class="form-group">
            <label for="originCountry">Країна походження:</label>
            <select id="originCountry" th:field="*{originCountry}" required>
                <option value="">-- Виберіть Країну --</option>
                <option th:each="country : ${countries}"
                        th:value="${country.id}"
                        th:text="${country.name}"
                        th:selected="${coffeeBean.originCountry != null and coffeeBean.originCountry.id == country.id}">Ефіопія</option>
            </select>
        </div>

        <div class="form-group">
            <label for="brand">Бренд:</label>
            <select id="brand" th:field="*{brand}" required>
                <option value="">-- Виберіть Бренд --</option>
                <option th:each="brand : ${brands}"
                        th:value="${brand.id}"
                        th:text="${brand.name}"
                        th:selected="${coffeeBean.brand != null and coffeeBean.brand.id == brand.id}">Lavazza</option>
            </select>
        </div>

        <hr>

        <div class="form-group">
            <label>Вага:</label>
            <select th:field="*{weight}" required>
                <option value="">-- Виберіть Рівень --</option>
                <option th:each="weight : ${weights}"
                        th:value="${weight}"
                        th:text="${weight.displayName}"
                        th:selected="${weight == coffeeBean.weight}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Рівень обсмаження:</label>
            <select th:field="*{roastLevel}" required>
                <option value="">-- Виберіть Рівень --</option>
                <option th:each="roast : ${roastLevels}"
                        th:value="${roast}"
                        th:text="${roast.displayName}"
                        th:selected="${roast == coffeeBean.roastLevel}"></option>
            </select>
        </div>
        <div class="form-group">
            <label>Гіркота:</label>
            <select th:field="*{bitterness}" required>
                <option value="">-- Виберіть Рівень --</option>
                <option th:each="b : ${bitternessLevels}" th:value="${b}" th:text="${b.displayName}" th:selected="${b == coffeeBean.bitterness}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Кислотність:</label>
            <select th:field="*{acidity}" required>
                <option value="">-- Виберіть Рівень --</option>
                <option th:each="a : ${acidityLevels}" th:value="${a}" th:text="${a.displayName}" th:selected="${a == coffeeBean.acidity}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Склад (Арабіка/Робуста):</label>
            <select th:field="*{composition}" required>
                <option value="">-- Виберіть Склад --</option>
                <option th:each="c : ${compositions}" th:value="${c}" th:text="${c.displayName}" th:selected="${c == coffeeBean.composition}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Інтенсивність:</label>
            <select th:field="*{intensity}" required>
                <option value="">-- Виберіть Інтенсивність --</option>
                <option th:each="i : ${intensityLevels}" th:value="${i}" th:text="${i.displayName}" th:selected="${i == coffeeBean.intensity}"></option>
            </select>
        </div>

        <hr>

        <div class="form-group">
            <label>Поточне Фото:</label>
            <div class="current-photo" th:if="${coffeeBean.photoPath != null}">
                <img th:src="@{/images/{path}(path=${coffeeBean.photoPath})}"
                     alt="Поточне фото кави"
                     style="max-width: 150px; border: 1px solid #ddd; padding: 5px;">
                <p><small>Ім'я файлу в базі: <span th:text="${coffeeBean.photoPath}"></span></small></p>
            </div>
            <div th:unless="${coffeeBean.photoPath != null}">
                <p class="text-muted">Фото не завантажено.</p>
            </div>
        </div>

        <div class="form-group">
            <label for="photoFile">Завантажити Нове Фото (опціонально):</label>
            <input type="file" id="photoFile" name="photo" accept="image/*">
            <small>Якщо поле залишити порожнім, поточне фото буде збережено.</small>
        </div>

        <button type="submit">Зберегти Зміни</button>
        <a th:href="@{/admin/coffeeList}">Скасувати та повернутися до списку</a>

    </form>
</div>

</body>
</html>
