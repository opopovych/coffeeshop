<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >
    <title>Список Кавових Продуктів</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; padding:0; background: #f4f4f4; }
        header { background: #2e2a28; color:white; padding:15px; text-align:center; }
        h2 { margin-top: 30px; }
        .container { width: 95%; max-width: 1200px; margin: 20px auto; }
        table { width:100%; border-collapse: collapse; margin-bottom: 30px; background: white; }
        th, td { border:1px solid #ccc; padding:8px; text-align:left; }
        th { background:#eee; }
        a.button { padding:5px 10px; background:#3e2723; color:white; text-decoration:none; border-radius:3px; margin-right:5px;}
        a.button:hover { background:#5d4037; }
        input, select, textarea { padding:5px; margin:3px 0; width:100%; }
        form { margin-top:10px; }
        .section { background:white; padding:15px; margin-bottom:20px; border-radius:5px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>

<body>
<div th:replace="~{fragments/adminnavbar :: navbar}"></div>


<div class="container">

    <!-- ==================== ТОВАРИ ==================== -->
    <div class="section">
<h2>Товари</h2>
<a th:href="@{/admin/coffee/add}" class="button">Додати товар</a>
<table>
    <thead>
    <tr>
        <th>Фото</th>
        <th>ID</th>
        <th>Назва</th>
        <th>Бренд</th>
        <th>Країна</th>
        <th>Ціна</th>
        <th>Обсмаження</th>
        <th>Дії</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="coffee : ${coffeeList}">

        <!-- Фото -->
        <td>
            <img th:src="@{'/images/' + ${coffee.photoPath}}" width="50" alt="Фото">
        </td>

        <td th:text="${coffee.id}">1</td>
        <td th:text="${coffee.name} + ' ' + ${coffee.weight.displayName}">Арабіка Ефіопія</td>
        <td th:text="${coffee.brand.name}">Бренд X</td>
        <td th:text="${coffee.originCountry.name}">Ефіопія</td>

        <td th:text="${#numbers.formatDecimal(coffee.price, 0, 'COMMA', 2, 'POINT')} + ' грн'">150.00 грн</td>

        <td th:text="${coffee.roastLevel.displayName}">Середнє</td>

        <td class="action-links">
            <a th:href="@{/admin/coffee/edit/{id}(id=${coffee.id})}" class="button">Редагувати</a>
            <a th:href="@{/admin/coffee/delete/{id}(id=${coffee.id})}"
               onclick="return confirm('Ви впевнені, що хочете видалити цей продукт?')" class="button">Видалити</a>
        </td>

    </tr>
    </tbody>
</table>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>

<!-- Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

<!-- Bootstrap 4 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
