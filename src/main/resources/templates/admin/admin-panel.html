<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Admin Panel - IJO Coffee</title>
    <style>
        /* Основні налаштування */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            overflow-x: hidden; /* Щоб не було горизонтальної прокрутки при згортанні */
        }

        .navbar-dark.bg-dark {
            background-color: #2e2a28 !important;
            z-index: 1050; /* Щоб навка була поверх усього */
        }

        /* LAYOUT */
        #wrapper {
            display: flex;
            width: 100vw;
            min-height: calc(100vh - 56px);
        }

        /* SIDEBAR STYLE */
        #sidebar-wrapper {
            min-width: 250px;
            max-width: 250px;
            background: #2e2a28;
            border-right: 1px solid rgba(197, 160, 89, 0.2);
            transition: all 0.3s ease;
        }

        /* Стан при згортанні */
        #wrapper.toggled #sidebar-wrapper {
            margin-left: -250px;
        }

        .nav-sidebar-link {
            padding: 15px 20px;
            display: block;
            color: white;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .nav-sidebar-link:hover {
            background: #3e2723;
            color: #c5a059;
            text-decoration: none;
        }

        .nav-sidebar-link i {
            margin-right: 10px;
            color: #c5a059;
            width: 20px;
            text-align: center;
        }

        /* CONTENT AREA */
        #page-content-wrapper {
            flex: 1; /* Займає весь доступний простір */
            transition: all 0.3s ease;
        }

        .admin-hero {
            background: linear-gradient(rgba(46, 42, 40, 0.8), rgba(46, 42, 40, 0.8)),
                url('https://images.pexels.com/photos/302899/pexels-photo-302899.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') center/cover;
            padding: 60px 0;
            color: white;
            text-align: center;
        }

        .stat-card {
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 30px;
            text-align: center;
            transition: 0.3s;
            border-radius: 5px;
            height: 100%;
            display: block;
            text-decoration: none !important;
        }

        .stat-card:hover {
            border-color: #c5a059;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transform: translateY(-3px);
        }

        .stat-number {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: #0d0a09;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
        }

        .gold-text { color: #c5a059; }

        /* Кнопка Burger IJO */
        #menu-toggle {
            background: transparent;
            border: 1px solid rgba(197, 160, 89, 0.5);
            color: #c5a059;
            border-radius: 4px;
            padding: 5px 12px;
            margin-right: 15px;
            transition: 0.3s;
        }

        #menu-toggle:hover {
            background: rgba(197, 160, 89, 0.1);
        }

        .btn-outline-gold:hover {
            background-color: #c5a059 !important;
            color: #fff !important;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <button id="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>

        <a class="navbar-brand" th:href="@{/admin}">
            ☕ IJO Coffee | Адмін
        </a>
        
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/coffee}">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Головна сторінка</a></li>

            
                <li class="nav-item ml-lg-4">
                    <form th:action="@{/logout}" method="post" class="form-inline">
                        <button type="submit" class="btn btn-outline-gold"
                            style="color: #c5a059; border-color: #c5a059; border-radius: 20px; padding: 2px 15px; font-size: 0.7rem; text-transform: uppercase;">
                            Вийти
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <div id="wrapper">
        <div id="sidebar-wrapper">
            <nav class="mt-3">
                <a th:href="@{/admin/orders}" class="nav-sidebar-link"><i class="fas fa-shopping-cart"></i> Замовлення</a>
                <a th:href="@{/admin/coffee/list}" class="nav-sidebar-link"><i class="fas fa-coffee"></i> Склад товарів</a>
                <a th:href="@{/admin/marketing}" class="nav-sidebar-link"><i class="fas fa-percent"></i> Маркетинг</a>
                <a th:href="@{/admin/sync}" class="nav-sidebar-link"><i class="fas fa-sync"></i> Синхронізація</a>
                <a th:href="@{/admin/coffee/brands}" class="nav-sidebar-link"><i class="fas fa-award"></i> Бренди</a>
                <a th:href="@{/admin/coffee/countries}" class="nav-sidebar-link"><i class="fas fa-globe-americas"></i> Країни</a>
            </nav>
        </div>

        <div id="page-content-wrapper">
            <div class="admin-hero">
                <div class="container text-center">
                    <h1 style="font-family: 'Playfair Display', serif; font-weight: 700;">Вітаємо, Адміністратор IJO</h1>
                    <p class="lead" style="font-weight: 200; letter-spacing: 2px;">Контроль якості та управління замовленнями</p>
                </div>
            </div>

            <div class="container mt-n5">
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <a th:href="@{/admin/orders}" class="stat-card shadow-sm">
                            <i class="fas fa-shopping-bag gold-text mb-2" style="font-size: 1.5rem;"></i>
                            <span class="stat-number" th:text="${ordersCount}">12</span>
                            <span class="stat-label">Нових замовлень</span>
                        </a>
                    </div>
                    <div class="col-md-4 mb-4">
                        <a th:href="@{/admin/coffee/list}" class="stat-card shadow-sm">
                            <i class="fas fa-box-open gold-text mb-2" style="font-size: 1.5rem;"></i>
                            <span class="stat-number" th:text="${productsCount}">48</span>
                            <span class="stat-label">Товарів у каталозі</span>
                        </a>
                    </div>
                    <div class="col-md-4 mb-4">
                        <a th:href="@{/admin/coffee/brands}" class="stat-card shadow-sm">
                            <i class="fas fa-award gold-text mb-2" style="font-size: 1.5rem;"></i>
                            <span class="stat-number" th:text="${brandsCount}">6</span>
                            <span class="stat-label">Активних брендів</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            $("#menu-toggle").click(function(e) {
                e.preventDefault();
                $("#wrapper").toggleClass("toggled");
            });
        });
    </script>
</body>
</html>
