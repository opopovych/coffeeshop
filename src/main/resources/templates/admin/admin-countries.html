<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >
    <title>Admin Panel - Coffee Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; padding:0; background: #f4f4f4; }
        header { background: #2e2a28; color:white; padding:15px; text-align:center; }
        h2 { margin-top: 30px; }
        .container { width: 95%; max-width: 1200px; margin: 20px auto; }
        table { width:100%; border-collapse: collapse; margin-bottom: 30px; background: white; }
        th, td { border:1px solid #ccc; padding:8px; text-align:left; }
        th { background:#eee; }
        a.button { padding:5px 10px; background:#3e2723; color:white; text-decoration:none; border-radius:3px; margin-right:5px;}
        a.button:hover { background:#5d4037; }
        input, select, textarea { padding:5px; margin:3px 0; width:100%; }
        form { margin-top:10px; }
        .section { background:white; padding:15px; margin-bottom:20px; border-radius:5px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav th:fragment="adminNavbar"class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" th:href="@{/admin}">
            ☕ IJO Coffee | Адмін
        </a>
    
        <button class="navbar-toggler" type="button"
                data-toggle="collapse"
                data-target="#adminNavbar"
                aria-controls="adminNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav mr-auto">
    
                <!-- Головна -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        Головна
                    </a>
                </li>
    
                <!-- Товари -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="coffeeDropdown"
                       role="button"
                       data-toggle="dropdown"
                       aria-haspopup="true"
                       aria-expanded="false">
                        Товари
                    </a>
                    <div class="dropdown-menu" aria-labelledby="coffeeDropdown">
                        <a class="dropdown-item" th:href="@{/admin/coffee/add}">
                            ➕ Створення товару
                        </a>
                        <a class="dropdown-item" th:href="@{/admin/coffeeList}">
                            📋 Перегляд товарів
                        </a>
                    </div>
                </li>
    
                <!-- Бренди -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="brandDropdown"
                       role="button"
                       data-toggle="dropdown">
                        Бренди
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" th:href="@{/admin/coffee/add-brand}">
                            ➕ Створення бренду
                        </a>
                        <a class="dropdown-item" th:href="@{/admin/brands}">
                            📋 Перегляд брендів
                        </a>
                    </div>
                </li>
    
                <!-- Країни -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="countryDropdown"
                       role="button"
                       data-toggle="dropdown">
                        Країни
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" th:href="@{/admin/coffee/add-country}">
                            ➕ Створення країни
                        </a>
                        <a class="dropdown-item" th:href="@{/admin/countries}">
                            📋 Перегляд країн
                        </a>
                    </div>
                </li>
    
                <!-- Замовлення -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/orders}">
                        📦 Перегляд замовлень
                    </a>
                </li>
            </ul>
    
            <!-- Праворуч -->
            <span class="navbar-text text-light">
                Admin Panel
            </span>
        </div>
    </nav>
    

<div class="container">

    <!-- ==================== КРАЇНИ ==================== -->
    <div class="section">
        <h2>Країни</h2>
        <a th:href="@{/admin/coffee/add-country}" class="button">Додати країну</a>
        <table>
            <thead>
            <tr><th>ID</th><th>Назва</th><th>Дії</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${countries}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td>
                    <a th:href="@{'/admin/coffee/edit-country/' + ${c.id}}" class="button">Редагувати</a>
                    <a th:href="@{'/admin/coffee/delete-country/' + ${c.id}}" class="button"
                       onclick="return confirm('Видалити країну?');">Видалити</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>


</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>

<!-- Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

<!-- Bootstrap 4 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
