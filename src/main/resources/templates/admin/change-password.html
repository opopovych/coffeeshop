<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зміна пароля | IJO Coffee Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        :root {
            --ijo-gold: #c5a059;
            --ijo-dark: #343a40;
        }

        body {
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .card-header {
            background-color: var(--ijo-dark);
            color: white;
            border-radius: 12px 12px 0 0 !important;
            padding: 1.5rem;
        }

        .btn-ijo {
            background-color: var(--ijo-gold);
            color: white;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-ijo:hover {
            background-color: #b08d4a;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .form-control:focus {
            border-color: var(--ijo-gold);
            box-shadow: 0 0 0 0.2rem rgba(197, 160, 89, 0.25);
        }

        .input-group-text {
            background-color: white;
            border-right: none;
        }

        .form-control {
            border-left: none;
        }

        .back-link {
            color: #6c757d;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--ijo-gold);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span th:text="${error}">Помилка</span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle mr-2"></i>
                <span th:text="${success}">Пароль оновлено!</span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="card shadow">
                <div class="card-header text-center">
                    <h4 class="mb-0"><i class="fas fa-key mr-2"></i> Безпека аккаунта</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted text-center small mb-4">
                        Використовуйте надійний пароль для захисту адмін-панелі
                    </p>

                    <form th:action="@{/admin/profile/change-password}" method="post">

                        <div class="form-group">
                            <label class="small font-weight-bold">Поточний пароль</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-lock-open text-muted"></i></span>
                                </div>
                                <input type="password" name="oldPassword" class="form-control"
                                       placeholder="Введіть старий пароль" required>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="form-group">
                            <label class="small font-weight-bold">Новий пароль</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-shield-alt text-muted"></i></span>
                                </div>
                                <input type="password" name="newPassword" class="form-control"
                                       placeholder="Мінімум 6 символів" required minlength="6">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label class="small font-weight-bold">Підтвердження пароля</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-check-double text-muted"></i></span>
                                </div>
                                <input type="password" name="confirmPassword" class="form-control"
                                       placeholder="Повторіть новий пароль" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-ijo btn-block py-2 mb-3">
                            Оновити пароль
                        </button>

                        <div class="text-center">
                            <a href="/admin" class="back-link small">
                                <i class="fas fa-arrow-left mr-1"></i> Повернутися в адмінку
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Target_Corporation_logo_vector.svg/30px-Target_Corporation_logo_vector.svg.png"
                     alt="IJO Logo" style="opacity: 0.5;">
                <p class="text-muted small mt-2">IJO Coffee &copy; 2026</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
