<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Стиль для бокової панелі (Sidebar) */
        #wrapper { display: flex; transition: all 0.3s; }
        #sidebar-wrapper {
            min-height: calc(100vh - 56px); /* Висота мінус навбар */
            width: 250px;
            background: #3e2723;
            color: white;
            transition: margin 0.3s;
        }
        /* Клас для ховання */
        #wrapper.toggled #sidebar-wrapper { margin-left: -250px; }

        #page-content-wrapper { width: 100%; padding: 20px; background: #f4f4f4; }

        .nav-sidebar-link {
            color: rgba(255,255,255,0.7);
            padding: 15px 20px;
            display: block;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-sidebar-link:hover { background: rgba(0,0,0,0.1); color: white; text-decoration: none; }
        .nav-sidebar-link i { width: 25px; }

        /* Кнопка перемикача */
        #menu-toggle { background: #3e2723; border: none; color: white; padding: 5px 15px; margin-right: 15px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/adminnavbar :: navbar}"></div>

<div id="wrapper">
    <div id="sidebar-wrapper">
        <div class="p-3 text-uppercase small font-weight-bold" style="opacity: 0.5;">Меню керування</div>
        <a th:href="@{/admin/coffee}" class="nav-sidebar-link"><i class="fas fa-box"></i> Товари</a>
        <a th:href="@{/admin/sync}" class="nav-sidebar-link"><i class="fas fa-sync"></i> Синхронізація</a>
        <a th:href="@{/admin/marketing}" class="nav-sidebar-link"><i class="fas fa-bullhorn"></i> Маркетинг</a>
        <a th:href="@{/admin/settings}" class="nav-sidebar-link"><i class="fas fa-cog"></i> Налаштування</a>
    </div>

    <div id="page-content-wrapper">
        <button id="menu-toggle" class="btn btn-sm rounded mb-3">
            <i class="fas fa-bars"></i>
        </button>

        <div id="main-content">
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
        $("#menu-toggle").click(function(e) {
            e.preventDefault();
            $("#wrapper").toggleClass("toggled");
        });
    </script>
</body>
</html>
