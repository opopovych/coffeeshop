<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Налаштування магазину | Адмін-панель</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        :root { --ijo-gold: #c5a059; }
        .btn-ijo { background-color: var(--ijo-gold); color: white; border: none; }
        .btn-ijo:hover { background-color: #b08d4a; color: white; }
        .card-header { background-color: #343a40; color: white; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                ✅ Налаштування успішно оновлено!
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="card shadow">
                <div class="card-header">
                    <h4 class="mb-0">⚙️ Налаштування реквізитів ФОП</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted small">Ці дані автоматично відображатимуться у видаткових накладних.</p>
                    <hr>

                    <form th:action="@{/admin/settings/save}" th:object="${settings}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="form-group mb-3">
                            <label class="font-weight-bold">Повна назва (Постачальник):</label>
                            <input type="text" th:field="*{vendorName}" class="form-control"
                                   placeholder="Напр: ФОП Попович Олександр Ігорович" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label class="font-weight-bold">ІПН / ЄДРПОУ:</label>
                                <input type="text" th:field="*{taxNumber}" class="form-control"
                                       placeholder="10-значний номер">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label class="font-weight-bold">Група / Адреса:</label>
                                <input type="text" th:field="*{shopAddress}" class="form-control"
                                       placeholder="Напр: 2-га група оподаткування">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label class="font-weight-bold">Контактний телефон:</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control"
                                   placeholder="+380 ...">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/admin" class="text-muted">← Назад в адмінку</a>
                            <button type="submit" class="btn btn-ijo px-4">Зберегти зміни</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <small class="text-muted">IJO Coffee System &copy; 2026</small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
