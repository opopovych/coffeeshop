<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати Бренд</title>
    <style>
        /* ... CSS стилі ... */
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { resize: vertical; height: 150px; }
        button { padding: 10px 15px; background-color: #FFC107; color: black; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #e0a800; }
        .current-photo img { max-width: 150px; border: 1px solid #ccc; margin-top: 10px; }

    </style>
</head>
<body>

<h2>✏️ Редагувати Бренд Кави</h2>

<form th:action="@{/admin/coffee/edit-brand/{id}(id=*{id})}" th:object="${brand}" method="post" enctype="multipart/form-data">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="name">Назва Бренду:</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label for="history">Історія/Опис:</label>
        <textarea id="history" th:field="*{history}" rows="6"></textarea>
    </div>

    <div class="form-group">
        <label>Поточне Фото:</label>
        <div class="current-photo" th:if="${brand.photoPath != null}">
            <img th:src="@{/images/{path}(path=${brand.photoPath})}" alt="Поточне фото кави" style="max-width: 150px; border: 1px solid #ddd; padding: 5px;">
            <p><small>Поточний шлях: <span th:text="${brand.photoPath}"></span></small></p>
        </div>
        <div th:unless="${brand.photoPath != null}">
            <p class="text-muted">Фото не завантажено.</p>
        </div>
    </div>

    <div class="form-group">
        <label for="logo">Завантажити Нове Фото (опціонально):</label>
        <input type="file" id="logo" name="logo" accept="image/*">
        <small>Якщо поле залишити порожнім, поточне фото буде збережено.</small>
    </div>

    <button type="submit">Зберегти Зміни</button>

    <a th:href="@{/admin/coffee/brands}">Скасувати та повернутися до списку</a>

</form>

</body>
</html>
