<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >
    <title>Admin Panel - Coffee Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; padding:0; background: #f4f4f4; }
        header { background: #2e2a28; color:white; padding:15px; text-align:center; }
        h2 { margin-top: 30px; }
        .container { width: 95%; max-width: 1200px; margin: 20px auto; }
        table { width:100%; border-collapse: collapse; margin-bottom: 30px; background: white; }
        th, td { border:1px solid #ccc; padding:8px; text-align:left; }
        th { background:#eee; }
        a.button { padding:5px 10px; background:#3e2723; color:white; text-decoration:none; border-radius:3px; margin-right:5px;}
        a.button:hover { background:#5d4037; }
        input, select, textarea { padding:5px; margin:3px 0; width:100%; }
        form { margin-top:10px; }
        .section { background:white; padding:15px; margin-bottom:20px; border-radius:5px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        
        /* Стиль для кнопки всередині таблиці, щоб вона вписалася в твій дизайн */
        .btn-actions {
            background: #3e2723;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 5px 15px;
        }
        .btn-actions:hover {
            background: #5d4037;
            color: white;
        }
        .dropdown-item:hover {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/adminnavbar :: navbar}"></div>
    
<div class="container">

    <div class="section">
        <h2>Товари</h2>
        <a th:href="@{/admin/coffee/add}" class="button">Додати товар</a>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Фото</th>
                <th>Назва</th>
                <th>Бренд</th>
                <th>Ціна</th>
                <th>Дії</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="coffee : ${coffeeList}">
                <td th:text="${coffee.id}"></td>
                <td><img th:src="@{'/images/' + ${coffee.photoPath}}" width="50"/></td>
                <td th:text="${coffee.name} + ' ' + ${coffee.weight.displayName}">Арабіка Ефіопія</td>
                <td th:text="${coffee.brand.name}"></td>
                <td th:text="${coffee.price}"></td>
                <td>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-actions dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            Дії
                        </button>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" th:href="@{'/coffee/' + ${coffee.id}}" target="_blank">Переглянути</a>
                            
                            <a class="dropdown-item" th:href="@{'/admin/coffee/edit/' + ${coffee.id}}">Редагувати</a>
                            
                            <div class="dropdown-divider"></div>
                            
                            <a class="dropdown-item text-danger" 
                               th:href="@{'/admin/coffee/delete/' + ${coffee.id}}"
                               onclick="return confirm('Видалити товар?');">Видалити</a>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
