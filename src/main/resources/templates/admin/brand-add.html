<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Додати Новий Бренд</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { resize: vertical; height: 150px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

<h2>➕ Додати Новий Бренд Кави</h2>

<form th:action="@{/admin/coffee/add-brand}" th:object="${brand}" method="post">

    <div class="form-group">
        <label for="name">Назва Бренду:</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label for="history">Історія/Опис:</label>
        <textarea id="history" th:field="*{history}" rows="6"></textarea>
    </div>

    <button type="submit">Зберегти Бренд</button>

    <a th:href="@{/admin/coffee/brands}">Назад до списку</a>

</form>

</body>
</html>
