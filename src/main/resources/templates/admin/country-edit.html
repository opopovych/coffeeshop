<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати Країну Походження</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { resize: vertical; height: 150px; }
        button { padding: 10px 15px; background-color: #FFC107; color: black; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #e0a800; }
    </style>
</head>
<body>

<h2>✏️ Редагувати Країну Походження</h2>

<form th:action="@{/admin/coffee/edit-country/{id}(id=*{id})}" th:object="${country}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="name">Назва Країни:</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label for="history">Історія Кави в Країні/Опис:</label>
        <textarea id="history" th:field="*{history}" rows="6"></textarea>
    </div>

    <button type="submit">Зберегти Зміни</button>

    <a th:href="@{/admin/countries}">Скасувати та повернутися до списку</a>

</form>

</body>
</html>
