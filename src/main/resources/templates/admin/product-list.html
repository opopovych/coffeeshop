<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Управління товарами - IJO Coffee</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }

        /* Уніфікація Sidebar з твоїм оригінальним стилем */
        #wrapper { display: flex; min-height: 100vh; }

        #sidebar-wrapper {
            min-width: 250px;
            max-width: 250px;
            background: #2e2a28; /* Той самий колір, що у твого хедера */
            border-right: 1px solid rgba(197, 160, 89, 0.2);
        }

        .nav-sidebar-link {
            padding: 15px 20px;
            display: block;
            color: white;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .nav-sidebar-link:hover, .nav-sidebar-link.active {
            background: #3e2723;
            color: #c5a059; /* Твоє золото */
            text-decoration: none;
        }

        .nav-sidebar-link i {
            margin-right: 10px;
            color: #c5a059;
            width: 20px;
            text-align: center;
        }

        /* Контентна частина */
        #page-content-wrapper { width: 100%; padding: 25px; }

        .table-container {
            background: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .product-img {
            width: 50px; height: 50px;
            object-fit: cover;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .gold-text { color: #c5a059; }

        /* Кнопки */
        .btn-ijo { background: #3e2723; color: white; border-radius: 3px; }
        .btn-ijo:hover { background: #5d4037; color: #c5a059; }
    </style>
</head>
<body>

<div th:replace="~{fragments/adminnavbar :: navbar}"></div>

<div id="wrapper">
    <div id="sidebar-wrapper">
        <nav class="mt-3">
            <a th:href="@{/admin}" class="nav-sidebar-link"><i class="fas fa-th-large"></i> Дашборд</a>
            <a th:href="@{/admin/coffeeList}" class="nav-sidebar-link active"><i class="fas fa-coffee"></i> Товари</a>
            <a th:href="@{/admin/orders}" class="nav-sidebar-link"><i class="fas fa-shopping-cart"></i> Замовлення</a>
            <a th:href="@{/admin/sync}" class="nav-sidebar-link"><i class="fas fa-sync"></i> Синхронізація</a>
            <a th:href="@{/admin/marketing}" class="nav-sidebar-link"><i class="fas fa-percent"></i> Маркетинг</a>
        </nav>
    </div>

    <div id="page-content-wrapper">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="font-weight-bold" style="color: #2e2a28;">📋 Список товарів</h2>
            <a th:href="@{/admin/coffee/add}" class="btn btn-ijo">
                <i class="fas fa-plus mr-2"></i> Додати товар
            </a>
        </div>

        <div class="table-container">
            <table class="table table-hover">
                <thead class="thead-light">
                <tr>
                    <th>Фото</th>
                    <th>Назва / SKU</th>
                    <th>Ціна</th>
                    <th>Наявність</th>
                    <th>Акція</th>
                    <th>Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td>
                        <img th:src="@{'/images/' + ${p.photoPath}}"
                             class="product-img"
                             data-toggle="modal"
                             th:data-target="'#viewModal' + ${p.id}"
                             onerror="this.src='/images/no-image.png';">
                    </td>
                    <td>
                        <div class="font-weight-bold" th:text="${p.name}"></div>
                        <small class="text-muted" th:text="${p.sku}"></small>
                    </td>
                    <td class="font-weight-bold gold-text" th:text="${p.price + ' грн'}"></td>
                    <td>
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" th:id="'active' + ${p.id}"
                                   th:checked="${p.active}" th:onchange="'toggleStatus(' + ${p.id} + ', \'active\', this.checked)'">
                            <label class="custom-control-label" th:for="'active' + ${p.id}"></label>
                        </div>
                    </td>
                    <td>
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" th:id="'promo' + ${p.id}"
                                   th:checked="${p.promo}" th:onchange="'toggleStatus(' + ${p.id} + ', \'promo\', this.checked)'">
                            <label class="custom-control-label" th:for="'promo' + ${p.id}"></label>
                        </div>
                    </td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-secondary" data-toggle="modal" th:data-target="'#viewModal' + ${p.id}">
                                <i class="fas fa-eye"></i>
                            </button>
                            <a th:href="@{/admin/coffee/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/admin/coffee/delete/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Ви впевнені?')"><i class="fas fa-trash"></i></a>
                        </div>

                        <div class="modal fade" th:id="'viewModal' + ${p.id}" tabindex="-1" role="dialog" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered" role="document">
                                <div class="modal-content">
                                    <div class="modal-header" style="background: #2e2a28; color: white;">
                                        <h5 class="modal-title" th:text="${p.name}">Деталі товару</h5>
                                        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                                    </div>
                                    <div class="modal-body text-center">
                                        <img th:src="@{'/images/' + ${p.photoPath}}" class="img-fluid mb-3 shadow-sm" style="max-height: 300px; border-radius: 8px;">
                                        <h4 class="gold-text" th:text="${p.price + ' грн'}"></h4>
                                        <p class="text-muted" th:text="'Артикул: ' + ${p.sku}"></p>
                                        <hr>
                                        <p class="text-left" th:text="${p.description}"></p>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрити</button>
                                        <a th:href="@{/admin/coffee/edit/{id}(id=${p.id})}" class="btn btn-ijo">Редагувати</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleStatus(id, field, value) {
        $.post('/admin/coffee/update-status', { id: id, field: field, value: value })
         .fail(function() { alert('Помилка оновлення'); });
    }
</script>
</body>
</html>
