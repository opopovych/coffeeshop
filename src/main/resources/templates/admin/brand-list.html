<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >
    <title>Список Брендів</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: middle; } /* Додав центрування по вертикалі */
        th { background:#eee; }

        /* ВИПРАВЛЕННЯ ДЛЯ ФОТО */
        .photo-container {
            width: 80px;      /* Трохи збільшив область */
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff; /* Білий фон допомагає логотипам виглядати чистіше */
            border: 1px solid #f0f0f0;
            padding: 4px;
        }

        .photo-thumb {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Тепер точно нічого не обріжеться */
        }

        a.button { padding:5px 10px; background:#3e2723; color:white; text-decoration:none; border-radius:3px; margin-right:5px;}
        a.button:hover { background:#5d4037; }
        .section { background:white; padding:15px; margin-bottom:20px; border-radius:5px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }

        .history-truncate {
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/adminnavbar :: navbar}"></div>

<div class="section">
    <h2>Бренди</h2>

    <a th:href="@{/admin/coffee/add-brand}" class="button">Додати бренд</a>

    <table>
        <thead>
        <tr>
            <th>Фото</th>
            <th>ID</th>
            <th>Назва</th>
            <th>Історія/Опис</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="brand : ${brands}">
            <td>
                <div class="photo-container">
                    <img th:src="@{'/images/' + ${brand.photoPath}}" class="photo-thumb" alt="Фото">
                </div>
            </td>
            <td th:text="${brand.id}">1</td>
            <td th:text="${brand.name}">Lavazza</td>
            <td>
                <div class="history-truncate view-history"
                     th:text="${brand.history}"
                     th:attr="data-name=${brand.name}, data-history=${brand.history}">
                    ...
                </div>
            </td>
            <td>
                <a th:href="@{/admin/coffee/edit-brand/{id}(id=${brand.id})}" class="button">Редагувати</a>
                <a th:href="@{/admin/coffee/delete-brand/{id}(id=${brand.id})}" class="button" onclick="return confirm('Ви впевнені?')">Видалити</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="historyModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Історія бренду</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body" id="modalBody" style="white-space: pre-wrap;">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрити</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

<script>
    $(document).ready(function() {
        $('.view-history').on('click', function() {
            var name = $(this).attr('data-name');
            var history = $(this).attr('data-history');

            $('#modalTitle').text(name);
            $('#modalBody').text(history);
            $('#historyModal').modal('show');
        });
    });
</script>

</body>
</html>
