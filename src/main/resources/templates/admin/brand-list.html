<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >
    <title>Список Брендів</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background:#eee; }
        .action-links a { margin-right: 10px; text-decoration: none; }
        .add-button { margin-bottom: 20px; padding: 10px 15px; background-color: #007bff; color: white; border-radius: 4px; text-decoration: none; }
        .photo-thumb { width: 50px; height: 50px; object-fit: contain; }
        a.button { padding:5px 10px; background:#3e2723; color:white; text-decoration:none; border-radius:3px; margin-right:5px;}
        a.button:hover { background:#5d4037; }
        .section { background:white; padding:15px; margin-bottom:20px; border-radius:5px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }

    </style>
</head>
<body>

<div th:replace="~{fragments/adminnavbar :: navbar}"></div>

<div class="section">
<h2>Бренди</h2>

<a th:href="@{/admin/coffee/add-brand}" class="button">Додати бренд</a>

<table>
    <thead>
    <tr>
        <th>Фото</th>
        <th>ID</th>
        <th>Назва</th>
        <th>Історія/Опис</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="brand : ${brands}">
        <td>
            <img th:src="@{'/images/' + ${brand.photoPath}}" class="photo-thumb" alt="Фото">
        </td>
        <td th:text="${brand.id}">1</td>
        <td th:text="${brand.name}">Lavazza</td>
        <td th:text="${brand.history}">...</td>
        <td>
            <a th:href="@{/admin/coffee/edit-brand/{id}(id=${brand.id})}" class="button">Редагувати</a>
            <a th:href="@{/admin/coffee/delete-brand/{id}(id=${brand.id})}" class="button" onclick="return confirm('Ви впевнені?')">Видалити</a>
        </td>
    </tr>
    </tbody>
</table>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>

<!-- Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

<!-- Bootstrap 4 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
